<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 및 출퇴근 관리 시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #222222;
        }

        .tab-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: 1px solid #4CAF50;
            background-color: #ffffff;
            color: #4CAF50;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #4CAF50;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #444444;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            font-size: 15px;
            background-color: #eef4ff;
            outline: none;
        }

        input:focus {
            border-color: #4CAF50;
            background-color: #ffffff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #45a049;
        }

        .hidden {
            display: none !important;
        }

        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 15px;
            min-height: 22px;
        }

        .info-card {
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .work-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-in { background-color: #2196F3; }
        .btn-out { background-color: #ff9800; }

        .address-item {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            margin-top: 8px;
            cursor: pointer;
            background-color: #fff;
            transition: background-color 0.2s;
        }

        .address-item:hover {
            background-color: #eef4ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>회원 서비스</h2>

    <!-- 탭 버튼 -->
    <div class="tab-group">
        <button id="tabExisting" class="tab-btn active" onclick="switchMode('existing')">기존 회원</button>
        <button id="tabNew" class="tab-btn" onclick="switchMode('new')">신규 회원</button>
    </div>

    <!-- 기존 회원 조회 폼 -->
    <div id="existingForm">
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="exName" placeholder="이름 입력">
        </div>
        <div class="form-group">
            <label>생일 (주민번호 앞 6자리)</label>
            <input type="text" id="exBirth" placeholder="예: 010101" maxlength="6">
        </div>
        <button class="submit-btn" onclick="submitExisting()">조회하기</button>
    </div>

    <!-- 신규 회원 등록 폼 -->
    <div id="newForm" class="hidden">
        <div class="form-group">
            <label>이름</label>
            <input type="text" id="newName" placeholder="이름 입력">
        </div>
        <div class="form-group">
            <label>주민등록번호</label>
            <input type="text" id="newRrn" placeholder="숫자만 13자리 입력" maxlength="14">
        </div>
        <div class="form-group">
            <label>주소</label>
            <input type="text" id="newAddress" placeholder="주소 입력">
        </div>
        <button class="submit-btn" onclick="submitNew()">등록하기</button>
    </div>

    <!-- 메시지 출력 영역 -->
    <div id="message"></div>

    <!-- 동명이인 주소 선택 영역 -->
    <div id="selectBox" class="hidden">
        <p style="font-weight: bold; margin-top: 15px; margin-bottom: 5px;">동일 이름/생일 정보가 있습니다. 주소를 선택하세요:</p>
        <div id="addressList"></div>
    </div>

    <!-- 회원 정보 및 출퇴근 버튼 영역 -->
    <div id="resultBox" class="info-card hidden">
        <div class="info-row"><span>이름:</span> <strong id="resName"></strong></div>
        <div class="info-row"><span>나이:</span> <strong id="resAge"></strong></div>
        <div class="info-row"><span>성별:</span> <strong id="resGender"></strong></div>
        <div class="info-row"><span>생일:</span> <strong id="resBirth"></strong></div>
        <div class="info-row"><span>주소:</span> <strong id="resAddress"></strong></div>
        
        <div class="btn-group">
            <button class="work-btn btn-in" onclick="recordWork('출근')">출근</button>
            <button class="work-btn btn-out" onclick="recordWork('퇴근')">퇴근</button>
        </div>
    </div>
</div>

<script>
    // ★ 본인의 Apps Script 웹 앱 URL 주소를 넣어주세요. ★
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz4o1LxeCYFlSKT5XISWAad1yQuHZclZKIsMTaVrHXcvT1fmXq_JWY9mB_OLtBQH6gw/exec"; 

    let currentUserData = null;

    // 히든 iframe을 통한 안전한 Form POST 전송
    function sendDataViaForm(data, callback) {
        let iframe = document.getElementById('hidden_iframe');
        if (!iframe) {
            iframe = document.createElement('iframe');
            iframe.name = 'hidden_iframe';
            iframe.id = 'hidden_iframe';
            iframe.style.display = 'none';
            document.body.appendChild(iframe);
        }

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = GAS_URL;
        form.target = 'hidden_iframe';

        for (let key in data) {
            if (data.hasOwnProperty(key)) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                form.appendChild(input);
            }
        }

        document.body.appendChild(form);
        form.submit();
        document.body.removeChild(form);

        if (callback) setTimeout(callback, 1500);
    }

    // 음성 출력
    function speakText(text, callback) {  
        if ('speechSynthesis' in window) {  
            window.speechSynthesis.cancel();  
            const utterance = new SpeechSynthesisUtterance(text);  
            utterance.lang = 'ko-KR';  
            utterance.rate = 1.0;  
            if (callback) {  
                utterance.onend = callback;  
                utterance.onerror = callback;  
            }  
            window.speechSynthesis.speak(utterance);  
        } else {  
            if (callback) callback();  
        }  
    }  

    function resetToHome(messageText) {  
        currentUserData = null;  
        document.getElementById('exName').value = '';  
        document.getElementById('exBirth').value = '';  
        document.getElementById('newName').value = '';  
        document.getElementById('newRrn').value = '';  
        document.getElementById('newAddress').value = '';  
          
        document.getElementById('resultBox').classList.add('hidden');  
        document.getElementById('selectBox').classList.add('hidden');  
        switchMode('existing');  
          
        if (messageText) {  
            const messageDiv = document.getElementById('message');  
            messageDiv.style.color = 'green';  
            messageDiv.innerText = messageText;  
        }  
    }  

    function switchMode(mode) {  
        document.getElementById('message').innerText = '';  
        document.getElementById('resultBox').classList.add('hidden');  
        document.getElementById('selectBox').classList.add('hidden');  
        currentUserData = null;  

        if (mode === 'existing') {  
            document.getElementById('tabExisting').classList.add('active');  
            document.getElementById('tabNew').classList.remove('active');  
            document.getElementById('existingForm').classList.remove('hidden');  
            document.getElementById('newForm').classList.add('hidden');  
        } else {  
            document.getElementById('tabNew').classList.add('active');  
            document.getElementById('tabExisting').classList.remove('active');  
            document.getElementById('newForm').classList.remove('hidden');  
            document.getElementById('existingForm').classList.add('hidden');  
        }  
    }  

    function displayUserInfo(data) {  
        currentUserData = data;  
        document.getElementById('resName').innerText = data.name;  
        document.getElementById('resAge').innerText = data.age;  
        document.getElementById('resGender').innerText = data.gender;  
        document.getElementById('resBirth').innerText = data.birth;  
        document.getElementById('resAddress').innerText = data.address;  
          
        document.getElementById('selectBox').classList.add('hidden');  
        document.getElementById('resultBox').classList.remove('hidden');  
    }  

    // 기존 회원 조회
    function submitExisting() {  
        const name = document.getElementById('exName').value.trim();  
        const birth = document.getElementById('exBirth').value.trim();  
        const messageDiv = document.getElementById('message');  

        if (!name || !birth) {  
            alert('이름과 생일(6자리)을 모두 입력해주세요.');  
            return;  
        }  

        const cleanBirth = birth.replace(/[^0-9]/g, '');  
        if (cleanBirth.length !== 6) {  
            alert('생일 6자리를 숫자만 올바르게 입력해주세요.');  
            return;  
        }  

        messageDiv.style.color = 'blue';  
        messageDiv.innerText = '정보 조회 중...';  
        document.getElementById('resultBox').classList.add('hidden');  
        document.getElementById('selectBox').classList.add('hidden');  

        fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&birth=${encodeURIComponent(cleanBirth)}`)  
        .then(response => response.json())  
        .then(data => {  
            if (data.result === 'found') {  
                messageDiv.innerText = '';  
                displayUserInfo(data.data);  
            } else if (data.result === 'multiple') {  
                messageDiv.innerText = '';  
                const addressListDiv = document.getElementById('addressList');  
                addressListDiv.innerHTML = '';  
                  
                data.list.forEach((item) => {  
                    const div = document.createElement('div');  
                    div.className = 'address-item';  
                    div.innerHTML = `<strong>${item.name} (${item.birth})</strong> - ${item.address}`;  
                    div.onclick = function() {  
                        displayUserInfo(item);  
                    };  
                    addressListDiv.appendChild(div);  
                });  
                  
                document.getElementById('selectBox').classList.remove('hidden');  

            } else if (data.result === 'not_found') {  
                messageDiv.style.color = 'red';  
                messageDiv.innerText = '일치하는 회원 정보를 찾을 수 없습니다.';  
            } else {  
                messageDiv.style.color = 'red';  
                messageDiv.innerText = '오류 발생: ' + data.error;  
            }  
        })  
        .catch(error => {  
            console.error('Error:', error);  
            messageDiv.style.color = 'red';  
            messageDiv.innerText = '조회 중 오류가 발생했습니다.';  
        });  
    }  

    // 신규 회원 등록
    function submitNew() {  
        const name = document.getElementById('newName').value.trim();  
        const rrn = document.getElementById('newRrn').value.trim();  
        const address = document.getElementById('newAddress').value.trim();  
        const messageDiv = document.getElementById('message');  

        if (!name || !rrn || !address) {  
            alert('모든 항목을 입력해주세요.');  
            return;  
        }  

        let cleanRrn = rrn.replace(/[^0-9]/g, '');  
        if (cleanRrn.length !== 13) {  
            alert('주민등록번호 13자리를 올바르게 입력해주세요.');  
            return;  
        }  

        messageDiv.style.color = 'blue';  
        messageDiv.innerText = '등록 중입니다...';  

        const front6 = cleanRrn.substring(0, 6);
        const genderDigit = cleanRrn.charAt(6);
        const birthYearPrefix = (genderDigit === '1' || genderDigit === '2' || genderDigit === '5' || genderDigit === '6') ? '19' : '20';
        const birthYear = parseInt(birthYearPrefix + front6.substring(0, 2), 10);
        const currentYear = new Date().getFullYear();
        const age = currentYear - birthYear;
        const gender = (genderDigit === '1' || genderDigit === '3' || genderDigit === '5' || genderDigit === '7') ? '♂' : '♀';

        const userInfo = {
            name: name,
            rrn: cleanRrn,
            birth: front6,
            address: address,
            age: age,
            gender: gender
        };

        const payload = {  
            action: 'register',  
            name: name,  
            rrn: cleanRrn,  
            address: address  
        };  

        sendDataViaForm(payload, function() {
            switchMode('existing');
            displayUserInfo(userInfo);
            messageDiv.style.color = 'green';
            messageDiv.innerText = '등록 완료! 바로 출근 버튼을 누르실 수 있습니다.';
        });
    }  

    // 출퇴근 버튼 클릭 (이름, 나이, 주민번호 데이터 확실히 전달)
    function recordWork(type) {  
        if (!currentUserData) {  
            alert('로그인 정보가 없습니다.');  
            return;  
        }  

        const messageDiv = document.getElementById('message');  
        messageDiv.style.color = 'blue';  
        messageDiv.innerText = `${type} 기록 중...`;  

        const payload = {  
            action: 'work',  
            name: currentUserData.name,  
            age: currentUserData.age,  
            rrn: currentUserData.rrn,  
            type: type  
        };  

        sendDataViaForm(payload, function() {
            let voiceMsg = (type === '출근') ? "안녕하세요 반갑습니다." : "수고하셨습니다. 안녕히가십시오.";  
            speakText(voiceMsg, function() {  
                resetToHome(`${type} 처리되었습니다.`);  
            });  
        });
    }  
</script>
</body>
</html>
