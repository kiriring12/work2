<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 및 출퇴근 관리</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 380px;
        }
        h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-group button {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            border: 1px solid #4CAF50;
            background-color: white;
            color: #4CAF50;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-group button.active {
            background-color: #4CAF50;
            color: white;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .work-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn-clock-in {
            flex: 1;
            padding: 12px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-clock-out {
            flex: 1;
            padding: 12px;
            background-color: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        #message {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #eef7ee;
            border: 1px solid #c3e6c3;
            border-radius: 4px;
        }
        .result-box p {
            margin: 8px 0;
            color: #333;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>회원 서비스</h2>
    
    <div class="btn-group">
        <button type="button" id="tabExisting" class="active" onclick="switchMode('existing')">기존 회원</button>
        <button type="button" id="tabNew" onclick="switchMode('new')">신규 회원</button>
    </div>

    <!-- 기존 회원 인증 폼 -->
    <form id="existingForm">
        <div class="form-group">
            <label for="exName">이름</label>
            <input type="text" id="exName" placeholder="홍길동" required>
        </div>
        <div class="form-group">
            <label for="exRrn">주민등록번호</label>
            <input type="text" id="exRrn" placeholder="010101-3000000" maxlength="14" required>
        </div>
        <button type="submit" class="submit-btn">회원 확인 및 데이터 조회</button>
    </form>

    <!-- 신규 회원 등록 폼 -->
    <form id="newForm" class="hidden">
        <div class="form-group">
            <label for="newName">이름</label>
            <input type="text" id="newName" placeholder="홍길동" required>
        </div>
        <div class="form-group">
            <label for="newRrn">주민등록번호</label>
            <input type="text" id="newRrn" placeholder="010101-3000000" maxlength="14" required>
        </div>
        <div class="form-group">
            <label for="newAddress">주소</label>
            <input type="text" id="newAddress" placeholder="서울특별시 강남구..." required>
        </div>
        <button type="submit" class="submit-btn">등록하기</button>
    </form>

    <div id="message"></div>

    <!-- 조회 결과 및 출퇴근 선택 영역 -->
    <div id="resultBox" class="result-box hidden">
        <h3>회원 정보</h3>
        <p><strong>이름:</strong> <span id="resName"></span></p>
        <p><strong>나이:</strong> <span id="resAge"></span>세</p>
        <p><strong>성별:</strong> <span id="resGender"></span></p>
        <p><strong>주민등록번호:</strong> <span id="resRrn"></span></p>
        <p><strong>주소:</strong> <span id="resAddress"></span></p>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">

        <h4 style="margin: 10px 0; text-align: center;">출/퇴근 등록</h4>
        <div class="work-btn-group">
            <button type="button" class="btn-clock-in" onclick="recordWork('출근')">출근하기</button>
            <button type="button" class="btn-clock-out" onclick="recordWork('퇴근')">퇴근하기</button>
        </div>
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx9VSbfAVt9wKmRDiLu-ub7QYBIx8fsHfdI9VlaRe9ithHmER78aEbKOB7JjlLZpkZJ/exec";
    let currentUserData = null;

    // 음성(TTS) 재생 함수
    function speakText(text, callback) {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); // 이전 음성 취소
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = 1.0;
            
            if (callback) {
                utterance.onend = callback;
                utterance.onerror = callback;
            }
            
            window.speechSynthesis.speak(utterance);
        } else {
            if (callback) callback();
        }
    }

    // 초기 화면(입력 전 화면)으로 리셋하는 함수
    function resetToHome(messageText) {
        currentUserData = null;
        document.getElementById('existingForm').reset();
        document.getElementById('newForm').reset();
        document.getElementById('resultBox').classList.add('hidden');
        switchMode('existing');
        
        if (messageText) {
            const messageDiv = document.getElementById('message');
            messageDiv.style.color = 'green';
            messageDiv.innerText = messageText;
        }
    }

    function switchMode(mode) {
        document.getElementById('message').innerText = '';
        document.getElementById('resultBox').classList.add('hidden');
        currentUserData = null;

        if (mode === 'existing') {
            document.getElementById('tabExisting').classList.add('active');
            document.getElementById('tabNew').classList.remove('active');
            document.getElementById('existingForm').classList.remove('hidden');
            document.getElementById('newForm').classList.add('hidden');
        } else {
            document.getElementById('tabNew').classList.add('active');
            document.getElementById('tabExisting').classList.remove('active');
            document.getElementById('newForm').classList.remove('hidden');
            document.getElementById('existingForm').classList.add('hidden');
        }
    }

    // 회원 데이터 화면 표시
    function displayUserInfo(data) {
        currentUserData = data;
        document.getElementById('resName').innerText = data.name;
        document.getElementById('resAge').innerText = data.age;
        document.getElementById('resGender').innerText = data.gender;
        document.getElementById('resRrn').innerText = data.rrn;
        document.getElementById('resAddress').innerText = data.address;
        document.getElementById('resultBox').classList.remove('hidden');
    }

    // 기존 회원 로그인 및 데이터 조회
    document.getElementById('existingForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('exName').value.trim();
        const rrn = document.getElementById('exRrn').value.trim();
        const messageDiv = document.getElementById('message');

        messageDiv.style.color = 'blue';
        messageDiv.innerText = '정보 조회 중...';
        document.getElementById('resultBox').classList.add('hidden');

        fetch(`${GAS_URL}?name=${encodeURIComponent(name)}&rrn=${encodeURIComponent(rrn)}`)
        .then(response => response.json())
        .then(data => {
            if (data.result === 'found') {
                messageDiv.innerText = '';
                displayUserInfo(data.data);
            } else if (data.result === 'not_found') {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '일치하는 회원 정보를 찾을 수 없습니다.';
            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '오류 발생: ' + data.error;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.style.color = 'red';
            messageDiv.innerText = '조회 중 오류가 발생했습니다.';
        });
    });

    // 신규 회원 등록
    document.getElementById('newForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const name = document.getElementById('newName').value.trim();
        const rrn = document.getElementById('newRrn').value.trim();
        const address = document.getElementById('newAddress').value.trim();
        const messageDiv = document.getElementById('message');

        messageDiv.style.color = 'blue';
        messageDiv.innerText = '등록 중입니다...';

        const payload = {
            action: 'register',
            name: name,
            rrn: rrn,
            address: address
        };

        fetch(GAS_URL, {
            method: 'POST',
            contentType: 'application/json',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'already_exists') {
                // 이미 가입된 회원일 경우: 기존 회원 탭으로 전환 후 해당 회원의 정보 자동 표시
                switchMode('existing');
                document.getElementById('exName').value = name;
                document.getElementById('exRrn').value = rrn;
                
                messageDiv.style.color = 'orange';
                messageDiv.innerText = '이미 등록된 회원입니다. 기존 회원 정보로 이동합니다.';
                displayUserInfo(data.data);

            } else if (data.result === 'success') {
                // 신규 가입 성공 시: 기존 회원 탭으로 이동 후 신규 등록된 정보와 출퇴근 버튼 즉시 표시
                switchMode('existing');
                document.getElementById('exName').value = name;
                document.getElementById('exRrn').value = rrn;

                messageDiv.style.color = 'green';
                messageDiv.innerText = '등록 완료! 신규 등록된 회원 정보입니다.';
                displayUserInfo(data.data);
                document.getElementById('newForm').reset();

            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '등록 실패: ' + data.error;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.style.color = 'red';
            messageDiv.innerText = '오류가 발생했습니다.';
        });
    });

    // 출근 / 퇴근 버튼 전송 및 음성 안내 / 첫 화면 이동
    function recordWork(type) {
        if (!currentUserData) {
            alert('로그인 정보가 없습니다.');
            return;
        }

        const messageDiv = document.getElementById('message');
        messageDiv.style.color = 'blue';
        messageDiv.innerText = `${type} 기록 중...`;

        const payload = {
            action: 'work',
            name: currentUserData.name,
            age: currentUserData.age,
            rrn: currentUserData.rrn,
            type: type
        };

        fetch(GAS_URL, {
            method: 'POST',
            contentType: 'application/json',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            if (data.result === 'success') {
                let voiceMsg = '';
                if (type === '출근') {
                    voiceMsg = "안녕하세요 반갑습니다";
                } else if (type === '퇴근') {
                    voiceMsg = "수고하셨습니다. 안녕히가십시오";
                }

                // 음성 재생 후 첫 화면으로 초기화 이동
                speakText(voiceMsg, function() {
                    resetToHome(`${type} 처리되었습니다.`);
                });

            } else {
                messageDiv.style.color = 'red';
                messageDiv.innerText = '기록 실패: ' + data.error;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.style.color = 'red';
            messageDiv.innerText = '오류가 발생했습니다.';
        });
    }
</script>

</body>
</html>
